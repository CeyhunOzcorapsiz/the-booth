[project]
name = "the-booth"
version = "0.1.0"
description = "An AI broadcast crew that turns synthetic football events into a personal, fact-checked broadcast for every viewer."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "agent-framework-core>=1.23",
  "agent-framework-openai>=1.17",
  "python-dotenv>=1.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.6", "mcp>=2.3"]
mcp = ["mcp>=2.3"]
e2e = ["playwright>=1.48"]
vision = ["opencv-python-headless>=4.10", "numpy>=2.0", "imageio>=2.34", "imageio-ffmpeg>=0.5"]
azure = ["azure-monitor-opentelemetry>=1.6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["booth*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["e2e: browser tests (need Playwright and a browser)"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
